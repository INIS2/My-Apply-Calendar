<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0053db" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>My Apply Calendar</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="top-bar">
      <button class="icon-button back-button" id="backButton" type="button" aria-label="뒤로">‹</button>
      <button class="brand-button" data-view="dashboard" type="button" aria-label="대시보드로 이동">MAC</button>
      <div class="top-actions">
        <button class="icon-button" data-view="calendar" type="button" aria-label="달력">⌕</button>
        <button class="icon-button" data-view="profile" type="button" aria-label="마이페이지">◯</button>
      </div>
    </header>

    <main class="app-main">
      <section id="dashboardView" class="screen active" aria-label="대시보드">
        <div class="desktop-grid">
          <div class="dashboard-main">
            <section class="search-panel" aria-label="지원 검색">
              <div class="connection-strip" aria-live="polite">
                <span id="connectionDot" class="connection-dot local"></span>
                <strong id="connectionLabel">로컬 모드</strong>
                <small id="connectionHint">로그인 전에는 기기 안의 임시 데이터만 표시됩니다.</small>
              </div>
              <label class="search-field">
                <span>검색</span>
                <input id="searchInput" type="search" placeholder="회사명, 직무, 단계 검색" />
              </label>
            </section>

            <section class="stats-grid" aria-label="지원 현황">
              <article class="stat-card">
                <span id="summaryTotal">0</span>
                <p>전체 지원</p>
              </article>
              <article class="stat-card accent-blue">
                <span id="summaryLive">0</span>
                <p>진행중</p>
              </article>
              <article class="stat-card accent-brown">
                <span id="summaryDone">0</span>
                <p>완료</p>
              </article>
            </section>

            <section class="section-card list-section" aria-label="지원 리스트">
              <div class="section-head">
                <div>
                  <p class="overline">Applications</p>
                  <h1>지원 리스트</h1>
                </div>
                <button class="primary-action desktop-only" id="newApplyButton" type="button">새 지원</button>
              </div>
              <div id="applyList" class="apply-list"></div>
            </section>
          </div>

          <aside class="desktop-side">
            <section class="focus-card" aria-label="다음 일정">
              <p class="overline">Next Action</p>
              <strong id="focusTitle">다음 일정 없음</strong>
              <span id="focusCopy">지원 단계를 추가하면 여기에 표시됩니다.</span>
            </section>

            <section class="section-card mini-calendar" aria-label="간단 달력">
              <div class="calendar-head compact">
                <button class="icon-button" data-month="prev" type="button" aria-label="이전 달">‹</button>
                <h2 id="calendarTitleMini"></h2>
                <button class="icon-button" data-month="next" type="button" aria-label="다음 달">›</button>
              </div>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div id="calendarGridMini" class="calendar-grid compact"></div>
            </section>
          </aside>
        </div>
      </section>

      <section id="calendarView" class="screen" aria-label="달력">
        <section class="section-card calendar-screen">
          <div class="calendar-head">
            <div>
              <p class="overline" id="calendarSubtitle">Calendar</p>
              <h1 id="calendarTitle"></h1>
            </div>
            <div class="inline-actions">
              <button class="icon-button" data-month="prev" type="button" aria-label="이전 달">‹</button>
              <button class="icon-button" data-month="next" type="button" aria-label="다음 달">›</button>
            </div>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </section>

      <section id="detailView" class="screen" aria-label="지원 상세">
        <section class="detail-layout">
          <div class="detail-main">
            <section class="section-card detail-card">
              <span class="priority-rail" id="detailPriorityRail" aria-hidden="true"></span>
              <label>
                <span>Company Info</span>
                <input id="detailCompany" required placeholder="회사명" />
              </label>
              <label>
                <span>공고명 / 직무</span>
                <input id="detailRole" required placeholder="예: SW 개발 신입 채용" />
              </label>
            </section>

            <section class="section-card">
              <div class="section-head">
                <div>
                  <p class="overline">Priority</p>
                  <h2>지원 우선순위</h2>
                </div>
              </div>
              <div class="priority-options" id="priorityOptions">
                <button data-priority="high" type="button">긴급</button>
                <button data-priority="medium" type="button">보통</button>
                <button data-priority="low" type="button">낮음</button>
                <button data-priority="drop" type="button">보류</button>
              </div>
            </section>

            <section class="section-card">
              <label>
                <span>지원 메모</span>
                <textarea id="detailNotes" rows="4" placeholder="지원 동기, 준비할 것, 면접 복기 등을 기록하세요."></textarea>
              </label>
              <div class="url-grid">
                <label>
                  <span>공고 URL</span>
                  <input id="detailUrl" type="url" placeholder="https://..." />
                </label>
                <label>
                  <span>지원 URL</span>
                  <input id="detailApplyUrl" type="url" placeholder="https://..." />
                </label>
              </div>
            </section>
          </div>

          <section class="section-card stage-panel">
            <div class="section-head">
              <div>
                <p class="overline">Stages</p>
                <h2>전형 단계 관리</h2>
              </div>
              <button class="secondary-action" id="addStageButton" type="button">단계 추가</button>
            </div>
            <div id="stageRows" class="stage-list"></div>
            <div class="detail-actions">
              <button class="danger-button" id="deleteApplyButton" type="button">삭제</button>
              <span></span>
              <button class="ghost-button" id="cancelDetailButton" type="button">취소</button>
              <button class="primary-action" id="saveDetailButton" type="button">저장</button>
            </div>
          </section>
        </section>
      </section>

      <section id="profileView" class="screen" aria-label="마이페이지">
        <section class="profile-layout">
          <div class="profile-hero">
            <div class="avatar" aria-hidden="true">M</div>
            <div>
              <h1>마이페이지</h1>
              <p>Supabase Auth 연결 전까지는 로컬 프로필 상태로 표시됩니다.</p>
            </div>
          </div>

          <section class="stats-grid">
            <article class="stat-card">
              <span id="profileTotal">0</span>
              <p>전체 지원</p>
            </article>
            <article class="stat-card accent-blue">
              <span id="profileLive">0</span>
              <p>진행중</p>
            </article>
            <article class="stat-card accent-brown">
              <span id="profileDone">0</span>
              <p>완료</p>
            </article>
          </section>

          <section class="section-card settings-list">
            <div class="settings-row">
              <span>연결 상태</span>
              <strong id="syncStatus">로컬 모드</strong>
            </div>
            <form id="authForm" class="settings-form">
              <label>
                <span>Email</span>
                <input id="authEmailInput" type="email" autocomplete="email" placeholder="you@example.com" />
              </label>
              <label>
                <span>Password</span>
                <input id="authPasswordInput" type="password" autocomplete="current-password" placeholder="비밀번호" />
              </label>
              <label>
                <span>Nickname</span>
                <input id="authNicknameInput" placeholder="닉네임" />
              </label>
              <div class="form-actions">
                <button class="primary-action" id="signInButton" type="button">로그인</button>
                <button class="secondary-action" id="signUpButton" type="button">회원가입</button>
                <button class="ghost-button" id="signOutButton" type="button">로그아웃</button>
              </div>
            </form>
            <button id="syncLocalButton" type="button"><span>로컬 데이터를 Supabase로 올리기</span><strong>Sync</strong></button>
          </section>
        </section>
      </section>
    </main>

    <div class="mobile-add">
      <button class="primary-action" id="mobileNewApplyButton" type="button">＋ 새 지원 추가</button>
    </div>

    <nav class="bottom-bar" aria-label="하단 내비게이션">
      <button class="bottom-nav active" data-view="dashboard" type="button"><span>▦</span>Dashboard</button>
      <button class="bottom-nav" data-view="calendar" type="button"><span>□</span>Calendar</button>
      <button class="bottom-nav" data-view="profile" type="button"><span>◯</span>Profile</button>
    </nav>

    <dialog id="dayDialog" class="modal">
      <div class="modal-head">
        <div>
          <p class="overline">Calendar</p>
          <h2 id="dayDialogTitle">일정</h2>
        </div>
        <button class="ghost-button" id="closeDayDialogButton" type="button">닫기</button>
      </div>
      <div id="dayDetails" class="day-details"></div>
    </dialog>

    <script type="module" src="assets/js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js");
        });
      }
    </script>
  </body>
</html>
